<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>色彩封印之門</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07101f;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}main{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.portal{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;background:url("first-index.webp") center/contain no-repeat}.hotspot{position:absolute;top:75.1%;height:14.7%;border:2px solid transparent;border-radius:28px;background:transparent;cursor:pointer;font-size:0;color:transparent}.hotspot:hover,.hotspot:focus-visible{border-color:#fff;box-shadow:0 0 0 4px #ffffff59,0 0 32px #fbbf24;outline:none}.hue{left:8.6%;width:23.9%}.brightness{left:38.5%;width:23%}.chroma{left:67.8%;width:22.9%}dialog{width:min(500px,calc(100% - 28px));border:1px solid #64748b;border-radius:24px;padding:0;background:#f8fafc;color:#0f172a;box-shadow:0 28px 80px #000a}dialog::backdrop{background:#020617d1;backdrop-filter:blur(5px)}form{padding:26px}h2{margin:0 0 8px;font-size:28px}p{line-height:1.55}label{display:block;margin:16px 0 7px;color:#334155;font-weight:900}select,input{width:100%;min-height:52px;border:2px solid #94a3b8;border-radius:12px;padding:10px 12px;background:#fff;color:#0f172a;font:inherit;font-size:19px}.message{min-height:26px;margin:14px 0 0;color:#9a3412;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}.actions button{min-height:52px;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:900;cursor:pointer}.cancel{background:#e2e8f0}.submit{background:#fbbf24;color:#111827}.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.teacher-link{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:6px;border:1px solid #ffffff40;border-radius:999px;padding:8px 11px;background:#02061766;color:#fff;text-decoration:none;font-size:13px;font-weight:800;opacity:.32;backdrop-filter:blur(6px);transition:.2s}.teacher-link:hover,.teacher-link:focus-visible{opacity:.95;border-color:#ffffffb3;background:#020617cc;outline:2px solid #fbbf24;outline-offset:2px}.fullscreen-button{position:fixed;z-index:10;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;align-items:center;gap:7px;border:1px solid #ffffff73;border-radius:999px;padding:9px 13px;background:#0206178c;color:#fff;font:800 14px "Microsoft JhengHei","Noto Sans TC",sans-serif;cursor:pointer;opacity:.65;backdrop-filter:blur(6px);transition:.2s;touch-action:manipulation}.fullscreen-button:hover,.fullscreen-button:focus-visible{opacity:1;border-color:#fff;background:#020617d9;outline:2px solid #fbbf24;outline-offset:2px}.fullscreen-button .icon{font-size:20px;line-height:1}@media(max-width:700px){.teacher-link,.fullscreen-button{top:max(8px,env(safe-area-inset-top));padding:8px 10px}.teacher-link span:last-child,.fullscreen-button span:last-child{display:none}}
</style></head><body><button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="切換全螢幕"><span class="icon" aria-hidden="true">⛶</span><span>全螢幕</span></button><button class="teacher-link" id="teacherEntry" type="button" aria-label="開啟教師管理頁"><span aria-hidden="true">⚙</span><span>教師管理</span></button><main><section class="portal" aria-label="色彩封印之門，請選擇今天的任務"><a class="hotspot hue" href="opening.html"><span class="screen-reader">第一節，色相封印，觀看完整開場並開始</span></a><button class="hotspot brightness" type="button" data-stage="brightness" data-title="第二節｜明度封印"><span class="screen-reader">第二節，明度封印，輸入接關密碼</span></button><button class="hotspot chroma" type="button" data-stage="chroma" data-title="第三節｜彩度封印"><span class="screen-reader">第三節，彩度封印，輸入接關密碼</span></button></section></main>
<dialog id="continueDialog"><form id="continueForm"><h2 id="dialogTitle">接關</h2><p>請輸入老師公布的本節接關密碼。</p><label for="continueClass">班級</label><select id="continueClass" required><option value="">請選擇班級</option><option value="714">714</option><option value="715">715</option><option value="716">716</option></select><label for="continuePassword">本節接關密碼</label><input id="continuePassword" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" placeholder="4 位數字" required><p id="continueMessage" class="message" aria-live="polite"></p><div class="actions"><button id="continueCancel" class="cancel" type="button">取消</button><button id="continueSubmit" class="submit" type="submit">確認接關</button></div></form></dialog>
<script>const continueApiUrl="https://script.google.com/macros/s/AKfycbx8jiW2JVvejI3wGGKwLl5PsqE00H1-osnz1-qAf80L7B8_rtKSfwX7EUW-szenJj9kBQ/exec",routes={brightness:"brightness-intro.html",chroma:"chroma-intro.html"},dialog=document.querySelector("#continueDialog"),form=document.querySelector("#continueForm"),classSelect=document.querySelector("#continueClass"),passwordInput=document.querySelector("#continuePassword"),message=document.querySelector("#continueMessage"),submitButton=document.querySelector("#continueSubmit");let selectedStage="";async function loadClasses(){try{const url=new URL(continueApiUrl);url.searchParams.set("action","classes");const response=await fetch(url.toString(),{cache:"no-store"}),result=await response.json();if(!result.success||!Array.isArray(result.classes)||!result.classes.length)return;const previous=classSelect.value;classSelect.replaceChildren(new Option("請選擇班級",""));result.classes.forEach(className=>classSelect.add(new Option(className,className)));if(result.classes.includes(previous))classSelect.value=previous}catch(error){console.warn("班級清單同步失敗，暫用預設選單。",error)}}loadClasses();const fullscreenButton=document.querySelector("#fullscreenButton");fullscreenButton.addEventListener("click",async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document)}else{const root=document.documentElement,enter=root.requestFullscreen||root.webkitRequestFullscreen;if(!enter){window.alert("此瀏覽器不支援網頁全螢幕。iPad 可將網站加入主畫面後開啟，畫面會更接近全螢幕。");return}await enter.call(root)}}catch(error){window.alert("目前無法進入全螢幕，請確認瀏覽器允許全螢幕播放。")} });document.addEventListener("fullscreenchange",()=>{fullscreenButton.querySelector("span:last-child").textContent=document.fullscreenElement?"退出全螢幕":"全螢幕"});document.addEventListener("webkitfullscreenchange",()=>{fullscreenButton.querySelector("span:last-child").textContent=document.webkitFullscreenElement?"退出全螢幕":"全螢幕"});document.querySelector("#teacherEntry").addEventListener("click",async()=>{const teacherKey=window.prompt("請輸入教師管理密碼");if(teacherKey===null||teacherKey==="")return;const button=document.querySelector("#teacherEntry");button.disabled=true;try{const response=await fetch(continueApiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"authenticate",teacherKey})}),result=await response.json();if(result.success){window.location.href="teacher-checkpoints.html";return}window.alert(result.message||"教師管理密碼錯誤")}catch(error){window.alert("目前無法驗證教師管理密碼，請稍後再試。")}finally{button.disabled=false}});document.querySelectorAll("[data-stage]").forEach(button=>button.addEventListener("click",()=>{selectedStage=button.dataset.stage;document.querySelector("#dialogTitle").textContent=button.dataset.title;message.textContent="";passwordInput.value="";dialog.showModal();classSelect.focus()}));document.querySelector("#continueCancel").addEventListener("click",()=>dialog.close());passwordInput.addEventListener("input",()=>{passwordInput.value=passwordInput.value.replace(/\D/g,"").slice(0,4)});form.addEventListener("submit",async event=>{event.preventDefault();const className=classSelect.value,password=passwordInput.value;if(!selectedStage||!className||!/^\d{4}$/.test(password)){message.textContent="請選擇班級並輸入 4 位數字。";return}submitButton.disabled=true;message.textContent="正在確認本節接關密碼…";try{const url=new URL(continueApiUrl);url.searchParams.set("action","verify");url.searchParams.set("stage",selectedStage);url.searchParams.set("className",className);url.searchParams.set("password",password);const response=await fetch(url.toString(),{cache:"no-store"}),result=await response.json();if(result.success&&result.valid){message.textContent="接關成功，正在進入本節任務…";window.location.href=routes[selectedStage];return}message.textContent=result.message||"班級或本節密碼錯誤。"}catch(error){message.textContent="目前無法連線驗證，請稍後再試或告訴老師。"}finally{submitButton.disabled=false}});</script></body></html>
